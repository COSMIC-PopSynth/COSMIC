name: CI to Docker Hub

on:
  push:
    branches: [ develop ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: dockerhub
    permissions:
      contents: read
    steps:
    
      - name: Check Out Repo 
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./
          file: ./Dockerfile
          push: true
          # .git is excluded from the build context, so hand the Dockerfile
          # the triggering commit for cosmic.__commithash__.
          build-args: |
            COSMIC_COMMIT_HASH=${{ github.sha }}
          # Tag the immutable commit SHA alongside latest so a bad build can be
          # rolled back to a known-good image.
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/cosmic-popsynth:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/cosmic-popsynth:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        env:
          IMAGE_DIGEST: ${{ steps.docker_build.outputs.digest }}
        run: echo "$IMAGE_DIGEST"
