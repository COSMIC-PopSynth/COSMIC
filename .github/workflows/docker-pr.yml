name: Docker build and smoke test

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.gitmodules'
      - 'meson.build'
      - 'pyproject.toml'
      - 'README.md'
      - 'LICENSE*'
      - 'src/**'
      - 'bin/**'
      - '.github/workflows/docker-pr.yml'
      - '.github/workflows/github_registory.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: cosmic-pr:test
          build-args: |
            COSMIC_COMMIT_HASH=${{ github.sha }}
          cache-from: type=gha,scope=docker-pr
          cache-to: type=gha,scope=docker-pr,mode=max

      - name: Smoke test installed package and CLI
        env:
          IMAGE_ID: ${{ steps.image.outputs.imageid }}
          EXPECTED_COMMIT_HASH: ${{ github.sha }}
        run: |
          # Use only the immutable image ID produced above, without registry pulls.
          docker run --rm --pull=never --network none -e EXPECTED_COMMIT_HASH "$IMAGE_ID" python -c 'import os, cosmic; from cosmic import _evolvebin; assert cosmic.__commithash__ == os.environ["EXPECTED_COMMIT_HASH"]'
          docker run --rm --pull=never --network none "$IMAGE_ID" cosmic-pop --help
