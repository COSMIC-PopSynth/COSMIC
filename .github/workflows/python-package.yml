# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Unit Test COSMIC

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_call:
    inputs:
      metisse-sha:
        description: Optional METISSE commit to test instead of the pinned gitlink
        required: false
        type: string
        default: ''
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Python ${{ matrix.python-version }} (${{ matrix.dependency-set }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        dependency-set: [highest]
        include:
          - python-version: '3.10'
            dependency-set: lowest

    steps:
    - name: Checkout repository with submodules
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        fetch-depth: 0  # needed for full submodule history
        persist-credentials: false

    - name: Check out requested METISSE commit
      if: inputs.metisse-sha != ''
      shell: bash
      env:
        METISSE_SHA: ${{ inputs.metisse-sha }}
      run: |
        set -euo pipefail
        if [[ ! "$METISSE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
          echo "Unexpected METISSE commit: $METISSE_SHA" >&2
          exit 1
        fi
        git -C src/cosmic/src/METISSE fetch --depth=1 origin "$METISSE_SHA"
        git -C src/cosmic/src/METISSE checkout --detach "$METISSE_SHA"
        git -C src/cosmic/src/METISSE submodule sync --recursive
        git -C src/cosmic/src/METISSE submodule update --init --recursive
        echo "Testing METISSE develop commit: \`$METISSE_SHA\`" >> "$GITHUB_STEP_SUMMARY"

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache pip
      if: inputs.metisse-sha == ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # This path is specific to Ubuntu
        path: ~/.cache/pip
        # Look to see if there is a cache hit for the corresponding requirements
        key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ matrix.dependency-set }}-${{ hashFiles('pyproject.toml', 'ci/constraints-lowest.txt') }}
        restore-keys: |
          ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ matrix.dependency-set }}-
          ${{ runner.os }}-py${{ matrix.python-version }}-pip-
          ${{ runner.os }}-
    - name: Install system and build dependencies
      run: |
        # upgrade apt-get and install system dependencies
        sudo apt-get update
        sudo apt-get install -y gfortran swig libhdf5-serial-dev python3-dev

        # upgrade pip and install build/lint tooling
        python -m pip install -U pip setuptools wheel packaging flake8 \
          "meson-python>=0.15" "meson>=1.3" ninja \
          "numpy>=2.0,<2.3; python_version<'3.14'" \
          "numpy>=2.3.2,<2.6; python_version>='3.14'"

    - name: Install package with highest-compatible dependencies
      if: matrix.dependency-set == 'highest'
      run: |
        python -m pip install --no-build-isolation -e ".[test]"

    - name: Install package with lowest direct dependencies
      if: matrix.dependency-set == 'lowest'
      run: |
        python -m pip install -c ci/constraints-lowest.txt "numpy>=2.0,<2.3"
        python -m pip install --no-build-isolation -c ci/constraints-lowest.txt -e ".[test]"
        
    - name: Test with pytest
      run: |
        bash ci/compile_benchmark.sh
        pytest --cov=./src/cosmic --cov-report=xml
        
    - name: Upload coverage to Codecov
      if: inputs.metisse-sha == ''
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        # Codecov rejects tokenless uploads on protected branches, so pushes to
        # develop need this secret. It is empty for pull requests from forks,
        # where the action falls back to a tokenless upload.
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false   # don't fail tests from code coverage alone
