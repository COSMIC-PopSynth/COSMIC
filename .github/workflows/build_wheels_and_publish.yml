name: Build wheel and publish

on:
  release:
    types: [published]
  workflow_dispatch:

# all cibuildwheel configuration lives in [tool.cibuildwheel] in pyproject.toml

jobs:
  build-wheels-and-dist:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # let the other platforms finish so a failure on one is easier to diagnose
      fail-fast: false
      matrix:
        # one macOS runner per architecture, since the wheels are built natively
        os: [ubuntu-latest, macos-14, macos-15-intel]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Switch METISSE submodule to track develop branch
      run: |
        git submodule set-branch --branch develop src/cosmic/src/METISSE
        git submodule update --remote src/cosmic/src/METISSE

    - uses: actions/setup-python@v5
      name: Install Python
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build cibuildwheel

    - name: Set up Fortran (macOS)
      if: runner.os == 'macOS'
      uses: fortran-lang/setup-fortran@v1
      with:
        compiler: gcc
        version: '13'

    - name: Build source distribution
      # only needs building once; the other jobs would produce an identical file
      if: matrix.os == 'ubuntu-latest'
      run: python -m build --sdist --outdir dist

    - name: Build wheels
      run: python -m cibuildwheel --output-dir dist

    - uses: actions/upload-artifact@v4
      with:
        name: dist-${{ matrix.os }}
        path: ./dist/*

  publish:
    needs: [build-wheels-and-dist]
    # manual runs build and test the wheels without uploading anything
    if: github.event_name == 'release'
    name: Publish Python 🐍 distributions 📦 to PyPI
    runs-on: ubuntu-latest

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Collect distributions
      run: |
        mkdir -p dist
        find artifacts -type f -name '*.whl' -exec cp {} dist/ \;
        find artifacts -type f -name '*.tar.gz' -exec cp {} dist/ \;

    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.pypi_password }}
