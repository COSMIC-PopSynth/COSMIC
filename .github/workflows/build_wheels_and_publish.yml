name: Build wheel and publish

on:
  release:
    types: [published]
  workflow_dispatch:

# all cibuildwheel configuration lives in [tool.cibuildwheel] in pyproject.toml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-wheels-and-dist:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      # let the other platforms finish so a failure on one is easier to diagnose
      fail-fast: false
      matrix:
        # one macOS runner per architecture, since the wheels are built natively
        os: [ubuntu-latest, macos-14, macos-15-intel]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
        submodules: recursive
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      name: Install Python
      with:
        python-version: "3.12"

    - name: Update system certificates
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y ca-certificates

    - name: Install dependencies
      run: |
        python -m pip install --no-deps --disable-pip-version-check --upgrade "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
        python -m pip install "certifi>=2026.10.19" build "cibuildwheel>=4.3.4"

    - name: Set up Fortran (macOS)
      if: runner.os == 'macOS'
      uses: fortran-lang/setup-fortran@be037f0a45b1160f139d4ccd0b96f9e9bfd6a682 # v1.10.0
      with:
        compiler: gcc
        version: '13'

    - name: Build source distribution
      # only needs building once; the other jobs would produce an identical file
      if: matrix.os == 'ubuntu-latest'
      run: python -m build --sdist --outdir dist

    - name: Build wheels
      run: python -m cibuildwheel --output-dir dist
        
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist-${{ matrix.os }}
        path: ./dist/*
        if-no-files-found: error

  publish:
    needs: [build-wheels-and-dist]
    # manual runs build and test the wheels without uploading anything
    if: github.event_name == 'release' && github.event.action == 'published'
    name: Publish Python 🐍 distributions 📦 to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: artifacts

    - name: Collect distributions
      run: |
        mkdir -p dist
        find artifacts -type f -name '*.whl' -exec cp {} dist/ \;
        find artifacts -type f -name '*.tar.gz' -exec cp {} dist/ \;

    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        password: ${{ secrets.pypi_password }}
        attestations: false
