name: Build wheel and publish

on: 
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

env:
  CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
  CIBW_ARCHS_LINUX: "x86_64"
  CIBW_SKIP: "*-win32 *musllinux* *t-*"
  CIBW_ARCHS_MACOS: "x86_64 arm64"
  CIBW_BUILD_VERBOSITY: "1"
  CIBW_BEFORE_ALL_LINUX: yum install -y gcc-gfortran
  CIBW_ENVIRONMENT_LINUX: "FC=gfortran F77=gfortran"
  CIBW_ENVIRONMENT_MACOS: "FC=gfortran F77=gfortran MACOSX_DEPLOYMENT_TARGET=14.0"

jobs:
  build-wheels-and-dist:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
        submodules: recursive
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      name: Install Python
      with:
        python-version: "3.12"
    - name: link gfortran and hdf5
      if: runner.os == 'macOS'
      run: |
        brew install hdf5

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install setuptools wheel build meson-python ninja meson pytest cibuildwheel

    - name: Set up Fortran (macOS)
      if: runner.os == 'macOS'
      uses: fortran-lang/setup-fortran@be037f0a45b1160f139d4ccd0b96f9e9bfd6a682 # v1.10.0
      with:
        compiler: gcc
        version: '13'
        
    - name: Build source and wheels distribution on Linux
      run: |
        python -m build --sdist --outdir dist
        python -m cibuildwheel --output-dir dist
        
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist-${{ matrix.os }}
        path: ./dist/*
        if-no-files-found: error

  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [build-wheels-and-dist]
    name: Publish Python 🐍 distributions 📦 to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/cosmic-popsynth
    permissions:
      id-token: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: artifacts

    - name: Collect distributions
      run: |
        mkdir -p dist
        find artifacts -type f -name '*.whl' -exec cp {} dist/ \;
        find artifacts -type f -name '*.tar.gz' -exec cp {} dist/ \;

    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
