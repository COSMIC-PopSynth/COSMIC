name: Build wheel and publish

on:
  release:
    types: [published]
  workflow_dispatch:

# all cibuildwheel configuration lives in [tool.cibuildwheel] in pyproject.toml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-wheels-and-dist:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      # let the other platforms finish so a failure on one is easier to diagnose
      fail-fast: false
      matrix:
        # one macOS runner per architecture, since the wheels are built natively
        os: [ubuntu-latest, macos-14, macos-15-intel]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
        submodules: recursive
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      name: Install Python
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build cibuildwheel

    - name: Set up Fortran (macOS)
      if: runner.os == 'macOS'
      uses: fortran-lang/setup-fortran@be037f0a45b1160f139d4ccd0b96f9e9bfd6a682 # v1.10.0
      with:
        compiler: gcc
        version: '13'

    - name: Build source distribution
      # only needs building once; the other jobs would produce an identical file
      if: matrix.os == 'ubuntu-latest'
      run: python -m build --sdist --outdir dist

    - name: Build wheels
      run: python -m cibuildwheel --output-dir dist
        
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist-${{ matrix.os }}
        path: ./dist/*
        if-no-files-found: error

  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [build-wheels-and-dist]
    # manual runs build and test the wheels without uploading anything
    if: github.event_name == 'release'
    name: Publish Python 🐍 distributions 📦 to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: artifacts

    - name: Collect distributions
      run: |
        mkdir -p dist
        find artifacts -type f -name '*.whl' -exec cp {} dist/ \;
        find artifacts -type f -name '*.tar.gz' -exec cp {} dist/ \;

    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        password: ${{ secrets.pypi_password }}
        attestations: false
