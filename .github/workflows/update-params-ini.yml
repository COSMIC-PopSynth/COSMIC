name: Update Params.ini

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions: {}

jobs:
  update-params-ini:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Generate Params.ini
        working-directory: docs
        run: python create_params_ini.py

      - name: Commit updated Params.ini
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add examples/Params.ini
          if git diff --staged --quiet; then
            echo "No changes to Params.ini, skipping commit."
          else
            git commit -m "update Params.ini"
            git push
          fi
