name: Flag CMC review for cosmic changes

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/cosmic/evolve.py'
      - 'src/cosmic/consts.py'
      - 'src/cosmic/data/cosmic-settings.json'
      - 'src/cosmic/src/ran3.f'

permissions: {}

jobs:
  flag-cmc-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: decide whether to flag PR
        id: decide
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            const SETTINGS_PATH = 'src/cosmic/data/cosmic-settings.json';
            const ALWAYS_FLAG_PATHS = [
              'src/cosmic/evolve.py',
              'src/cosmic/consts.py',
              'src/cosmic/src/ran3.f',
            ];

            // helper: fetch file content at a specific ref (sha/branch)
            async function fetchText(path, ref) {
              const res = await github.rest.repos.getContent({ owner, repo, path, ref });
              if (Array.isArray(res.data) || !res.data.content) {
                throw new Error(`unexpected content response for ${path} at ${ref}`);
              }
              const buff = Buffer.from(res.data.content, res.data.encoding || 'base64');
              return buff.toString('utf8');
            }

            // helper: count settings on the object with category === "bse"
            // json is expected to be an array: [{category: "blah", ...}, {category: "bse", ...}]
            function bseSettingCount(jsonVal) {
              if (!Array.isArray(jsonVal)) {
                throw new Error('settings document is not an array');
              }

              const bseObj = jsonVal.find(
                (x) => x && typeof x === 'object' && !Array.isArray(x) && x.category === 'bse'
              );

              if (!bseObj || !Array.isArray(bseObj.settings)) {
                throw new Error('bse settings array is missing');
              }

              return bseObj.settings.length;
            }

            // list changed files in the PR
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });

            const changed = new Set(files.map(f => f.filename));
            const changedCoreFiles = ALWAYS_FLAG_PATHS.filter(path => changed.has(path));
            const changedSettings = changed.has(SETTINGS_PATH);

            let shouldFlag = false;
            let reason = '';

            // changes to core implementation files always need CMC review
            if (changedCoreFiles.length > 0) {
              shouldFlag = true;
              reason = `core file changed: ${changedCoreFiles.join(', ')}`;
            } else if (changedSettings) {
              // only flag if the number of bse settings changes between base and head
              const baseSha = context.payload.pull_request.base.sha;
              const headSha = context.payload.pull_request.head.sha;

              try {
                const baseText = await fetchText(SETTINGS_PATH, baseSha);
                const headText = await fetchText(SETTINGS_PATH, headSha);

                const baseJson = JSON.parse(baseText);
                const headJson = JSON.parse(headText);

                const baseCount = bseSettingCount(baseJson);
                const headCount = bseSettingCount(headJson);

                if (baseCount !== headCount) {
                  shouldFlag = true;
                  reason = `bse setting count changed (${baseCount} -> ${headCount})`;
                } else {
                  shouldFlag = false;
                  reason = `bse setting count unchanged (${baseCount})`;
                }
              } catch (err) {
                // if parsing/fetching fails, be conservative and flag
                shouldFlag = true;
                reason = `could not compare bse setting count safely (${err.message}); flagging for review`;
              }
            }

            reason = reason.replace(/[`$\\\r\n]/g, ' ').slice(0, 200);
            const alreadyFlagged = context.payload.pull_request.labels.some(
              label => label.name === 'needs-cmc-review'
            );

            core.setOutput('should_flag', shouldFlag ? 'true' : 'false');
            core.setOutput('should_notify', shouldFlag && !alreadyFlagged ? 'true' : 'false');
            core.setOutput('reason', reason);

      - name: add "needs-cmc-review" label
        if: steps.decide.outputs.should_notify == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const labelName = 'needs-cmc-review';

            // ensure the label exists, or create it
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName,
              });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelName,
                  color: 'fbca04',
                  description: 'PR touches cosmic core/settings and needs CMC review',
                });
              } else {
                throw error;
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [labelName],
            });

      - name: comment to request CMC review
        if: steps.decide.outputs.should_notify == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REASON: ${{ steps.decide.outputs.reason }}
        with:
          script: |
            const reason = process.env.REASON || 'see workflow logs';

            const body = `
            🚨 **CMC review requested**

            This pull request modifies one or more of:
            - \`src/cosmic/evolve.py\`
            - \`src/cosmic/consts.py\`
            - \`src/cosmic/src/ran3.f\`
            - \`src/cosmic/data/cosmic-settings.json\` (only flagged when the number of \`category: "bse"\` settings changes)

            **Trigger:** ${reason}

            A CMC developer should review this PR to ensure corresponding changes are propagated upstream as needed.
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
