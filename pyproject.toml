[project]
name = "cosmic-popsynth"
distname = "cosmic"
description = "a Python-interfaced binary population synthesis suite"
authors = [
    { name="Katelyn Breivik", email="katie.breivik@gmail.com" },
    { name="Scott Coughlin" },
    { name="Michael Zevin" },
    { name="Carl L. Rodriguez" },
    { name="Tom Wagg" },
]
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.10"
license = { text = "MIT License" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
]
dependencies = [
    "numpy >= 2.0, < 2.3",
    "scipy >= 1.14.1, <1.16",
    "pandas >= 2.2.3, < 3.1",
    "astropy >= 6.1, < 9.0",
    "matplotlib >= 3.9, < 4.0",
    "tables >= 3.10.1, < 4.0",
    "h5py >= 3.12.0, < 4.0",
    "schwimmbad >= 0.3.1",
    "tqdm >= 4.0",
    "configparser",
]

[project.optional-dependencies]
doc = [
    "sphinx >= 1.6.1",
    "numpydoc >= 0.8.0",
    "sphinx-bootstrap-theme >= 0.6",
    "sphinxcontrib-programoutput",
    "sphinx-automodapi",
    "ipython",
    "sphinx_rtd_theme",
    "furo",
    "sphinx-design",
    "sphinx-copybutton",
    "sphinx-gallery",
]
test = [
    "pytest",
    "pytest-cov",
    "coverage",
    "cpp-coveralls",
    "importlib-metadata < 5.0",
    "wheel",
]
all = ["cosmic-popsynth[doc, test]"]

[build-system]
build-backend = 'mesonpy'
requires = ['meson-python>=0.15', 'meson>=1.3', 'numpy', 'ninja']

[tool.cibuildwheel.macos]
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

