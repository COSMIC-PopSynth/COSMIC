[project]
name = "cosmic-popsynth"
distname = "cosmic"
description = "a Python-interfaced binary population synthesis suite"
authors = [
    { name="Katelyn Breivik", email="katie.breivik@gmail.com" },
    { name="Scott Coughlin" },
    { name="Michael Zevin" },
    { name="Carl L. Rodriguez" },
    { name="Tom Wagg" },
]
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.10"
license = { text = "MIT License" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
]
dependencies = [
    "numpy >= 2.0, < 2.6",          # if you change numpy versions, also change it in the build-system section below
    "scipy >= 1.14.1, < 1.19",
    "pandas >= 2.2.3, < 3.1",
    "astropy >= 6.1, < 9.0",
    "matplotlib >= 3.9, < 4.0",
    "tables >= 3.10.1, < 4.0",
    "h5py >= 3.12.1, < 4.0",
    "schwimmbad >= 0.4.0",
    "tqdm >= 4.1",
    "configparser",
    "dill",
]

[project.optional-dependencies]
doc = [
    "sphinx >= 1.6.1",
    "numpydoc >= 0.8.0",
    "sphinx-bootstrap-theme >= 0.6",
    "sphinxcontrib-programoutput",
    "sphinx-automodapi",
    "ipython",
    "sphinx_rtd_theme",
    "furo",
    "sphinx-design",
    "sphinx-copybutton",
    "sphinx-gallery",
    "beautifulsoup4",
]
test = [
    "pytest",
    "pytest-cov",
    "coverage",
    "wheel",
]
merging-dco = ["legwork"]
all = ["cosmic-popsynth[doc, test, merging-dco]"]

[build-system]
build-backend = 'mesonpy'
requires = [
    'meson-python>=0.15',
    'meson>=1.3',
    'ninja',
    # numpy < 2.3 does not support Python 3.14, and numpy >= 2.3.2 (the
    # first release with cp314 wheels) publishes manylinux_2_28 wheels only.
    "numpy >= 2.0, < 2.3; python_version < '3.14'",
    "numpy >= 2.3.2, < 2.6;      python_version >= '3.14'",
]

[tool.cibuildwheel]
manylinux-x86_64-image = "manylinux2014"
before-test = "pip install \"numpy >= 2.0, < 2.3; python_version < '3.14'\" \"numpy >= 2.3.2, < 2.6; python_version >= '3.14'\""
test-environment = { PIP_NO_DEPS = "1" }
test-command = "python -c \"from cosmic import _evolvebin\""

# cp314 has to build against numpy >= 2.3.2, which ships manylinux_2_28 wheels only.
# Everything else stays on manylinux2014 (glibc 2.17) so the existing wheels keep
# working on older systems.
[[tool.cibuildwheel.overrides]]
select = "cp314-*"
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"
